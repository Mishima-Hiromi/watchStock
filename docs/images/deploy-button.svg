<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" width="920" height="560">
<rect x="0" y="0" width="920" height="560" fill="#f8fafc" />
<rect x="40" y="50" width="380" height="420" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" />
<rect x="40" y="50" width="380" height="44" rx="16" fill="#eef2f7" />
<rect x="40" y="72" width="380" height="22" fill="#eef2f7" />
<circle cx="60" cy="72" r="5" fill="#cbd5e1" /><circle cx="76" cy="72" r="5" fill="#cbd5e1" /><circle cx="92" cy="72" r="5" fill="#cbd5e1" />
<text x="230" y="78" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="600" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">セットアップガイド</text>
<line x1="40" y1="94" x2="420" y2="94" stroke="#e2e8f0" stroke-width="1.5" />
<text x="70" y="130" font-size="14" fill="#64748b" text-anchor="start" font-weight="normal" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">watchStock のセットアップ</text>
<text x="70" y="152.4" font-size="14" fill="#64748b" text-anchor="start" font-weight="normal" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">以下のボタンから始めます</text>
<rect x="70" y="210" width="320" height="56" rx="10" fill="#ea580c" />
<text x="230" y="243.6" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="600" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">Deploy to Cloudflare</text>
<circle cx="60" cy="200" r="15" fill="#ef4444" stroke="#ffffff" stroke-width="2" />
<text x="60" y="205.25" font-size="17.25" fill="#ffffff" text-anchor="middle" font-weight="bold" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">1</text>
<text x="230" y="504" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="normal" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">①ボタンを押す</text>
<line x1="430" y1="260" x2="478" y2="260" stroke="#64748b" stroke-width="3" />
<polygon points="490,260 476,253 476,267" fill="#64748b" />
<text x="460" y="248" font-size="14" fill="#64748b" text-anchor="middle" font-weight="normal" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">タップ</text>
<rect x="500" y="50" width="380" height="420" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" />
<rect x="500" y="50" width="380" height="44" rx="16" fill="#eef2f7" />
<rect x="500" y="72" width="380" height="22" fill="#eef2f7" />
<circle cx="520" cy="72" r="5" fill="#cbd5e1" /><circle cx="536" cy="72" r="5" fill="#cbd5e1" /><circle cx="552" cy="72" r="5" fill="#cbd5e1" />
<text x="690" y="78" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="600" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">Cloudflare</text>
<line x1="500" y1="94" x2="880" y2="94" stroke="#e2e8f0" stroke-width="1.5" />
<text x="530" y="140" font-size="14" fill="#64748b" text-anchor="start" font-weight="normal" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">続けるにはアカウントと</text>
<text x="530" y="162.4" font-size="14" fill="#64748b" text-anchor="start" font-weight="normal" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">連携してください</text>
<rect x="530" y="220" width="320" height="56" rx="10" fill="#2563eb" />
<text x="690" y="253.6" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="600" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">GitHub と連携する</text>
<rect x="524" y="214" width="332" height="68" rx="14" fill="none" stroke="#ef4444" stroke-width="4" />
<circle cx="520" cy="210" r="15" fill="#ef4444" stroke="#ffffff" stroke-width="2" />
<text x="520" y="215.25" font-size="17.25" fill="#ffffff" text-anchor="middle" font-weight="bold" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">2</text>
<text x="690" y="504" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="normal" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">②連携して開始</text>
<text x="460" y="546" font-size="12" fill="#94a3b8" text-anchor="middle" font-weight="normal" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">イラスト(実際の画面とは細部が異なります)</text>

